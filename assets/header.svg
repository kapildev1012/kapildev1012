<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Glow Gradients -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-orange" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glows -->
  <circle cx="250" cy="120" r="280" fill="url(#glow-cyan)" />
  <circle cx="1050" cy="280" r="320" fill="url(#glow-purple)" />
  <circle cx="640" cy="80" r="220" fill="url(#glow-orange)" />

  <!-- Subtle Tech Grid Line Accents -->
  <line x1="0" y1="390" x2="1280" y2="390" stroke="url(#border-grad)" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="120" cy="80" r="30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" fill="none" />
  <circle cx="1160" cy="320" r="45" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" fill="none" />

  <!-- Main Name Title -->
  <text x="640" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-size="54" font-weight="900" fill="url(#title-grad)" text-anchor="middle" letter-spacing="1.5">
    KAPIL DEV
  </text>

  <!-- Tagline / Roles -->
  <text x="640" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="600" fill="#f1f5f9" text-anchor="middle" letter-spacing="0.5">
    Full Stack Software Engineer (MERN) • AI &amp; Computer Vision • Cloud Architecture
  </text>

  <!-- Sub-Title / Status -->
  <text x="640" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
        font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Founder @ Zippin Full-Stack Solutions • B.Tech CSE @ HPTU • Hamirpur, Himachal Pradesh, India
  </text>

  <!-- Tech Stack Highlights Pill -->
  <g transform="translate(640, 295)">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="url(#border-grad)" stroke-width="1.5" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
          font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      ⚡ REACT • NEXT.JS • NODE.JS • MONGODB • PYTHON • OPENCV • WEBRTC ⚡
    </text>
  </g>

  <!-- Decorative Status Dots -->
  <g transform="translate(640, 355)">
    <circle cx="-50" cy="0" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="-25" cy="0" r="4" fill="#818cf8" opacity="0.8" />
    <circle cx="0" cy="0" r="5" fill="#a855f7" opacity="0.9" />
    <circle cx="25" cy="0" r="4" fill="#818cf8" opacity="0.8" />
    <circle cx="50" cy="0" r="4" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>