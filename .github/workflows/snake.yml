name: Generate Contribution Snake

on:
  schedule:
    # Run everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation in Green & Black
        uses: Platane/snk@v3
        with:
          github_user_name: kapildev1012
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#a252ff&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a252ff&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}